<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12141d" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00B8D4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00B8D4" stop-opacity="0.15" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Cyan Outer Glow & Border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Glow Layer Behind Letters -->
  <g filter="url(#glow)" opacity="0.45">
    <path d="M 126,340 L 186,170 L 246,340 M 146,285 L 226,285" stroke="url(#cyanGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 386,170 L 301,170 L 301,340 L 386,340 M 301,255 L 371,255" stroke="url(#cyanGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Crisp Front Layer Letters -->
  <g>
    <!-- Letter A -->
    <path d="M 126,340 L 186,170 L 246,340 M 146,285 L 226,285" stroke="url(#cyanGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Letter E -->
    <path d="M 386,170 L 301,170 L 301,340 L 386,340 M 301,255 L 371,255" stroke="url(#cyanGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
