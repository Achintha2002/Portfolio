<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Stats | Achintha Edirisinghe</title>
  <meta name="description" content="GitHub open source activity and contribution graph for Achintha Edirisinghe." />

  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    // Prevent FOUC by setting theme immediately
    const savedTheme = localStorage.getItem("portfolio_theme") || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            ghgreen: '#10B981'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
      background-size: 40px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }

    .os-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 1000px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .os-card {
        flex-direction: row;
      }
    }

    .graph-container img {
      width: 100%;
      height: auto;
      border-radius: 12px;
    }
  </style>
</head>

<body class="relative overflow-x-hidden">

  <div class="w-full max-w-3xl absolute top-6 left-6 flex justify-start z-10">
    <a href="index.html#other"
      class="inline-flex items-center gap-3 px-6 py-2.5 rounded-full font-bold text-black transition-all hover:scale-105"
      style="background: rgba(224, 254, 237, 0.8); border: 1px solid rgba(186, 253, 222, 0.8);">
      <i class="fas fa-arrow-left"></i> Back to Portfolio
    </a>
  </div>

  <div class="w-full max-w-2xl mt-8 text-center mb-10">
    <h4 class="text-xs font-bold tracking-widest uppercase mb-4" style="color: #10B981;">CONNECT WITH ME</h4>
    <h1 class="text-5xl sm:text-6xl font-bold mb-4" style="font-family: 'Outfit', sans-serif;">
      My Git <span style="color: #10B981;">Stats</span>
    </h1>
    <p class="text-gray-500 text-lg">Commits, streaks, and open source activity</p>
  </div>

  <div class="os-card flex flex-col md:flex-row gap-8 p-8 md:p-10">

    <!-- Left Column: Profile Info -->
    <div class="w-full md:w-[35%] flex flex-col gap-6">

      <h2 class="text-2xl md:text-3xl font-bold uppercase tracking-wider" style="font-family: 'Outfit', sans-serif;">
        Open Source <span class="text-ghgreen">Activity</span>
      </h2>

      <div class="flex items-center gap-4 mt-2">
        <div class="relative w-16 h-16 rounded-full p-[2px] bg-ghgreen">
          <img id="gh-avatar" src="https://avatars.githubusercontent.com/u/1?v=4" alt="Profile"
            class="w-full h-full rounded-full object-cover border-2 border-white dark:border-gray-800" />
        </div>
        <div class="flex flex-col">
          <h3 id="gh-name" class="text-xl font-bold text-gray-900 dark:text-white">Loading...</h3>
          <span class="text-gray-500 text-sm">@Achintha2002</span>
        </div>
      </div>

      <p id="gh-bio" class="text-gray-600 dark:text-gray-400 text-sm leading-relaxed min-h-[60px]">
        Loading bio...
      </p>

      <div class="grid grid-cols-3 gap-2 mt-4">
        <div class="flex flex-col items-center justify-start">
          <span id="gh-repos" class="text-3xl font-bold text-blue-500 mb-2">...</span>
          <span
            class="text-[0.65rem] font-bold text-gray-500 tracking-wider text-center leading-tight">PUBLIC<br />REPOS</span>
        </div>

        <div class="flex flex-col items-center justify-start">
          <span id="gh-commits" class="text-3xl font-bold text-orange-500 mb-2">-</span>
          <span
            class="text-[0.65rem] font-bold text-gray-500 tracking-wider text-center leading-tight">TOTAL<br />COMMITS</span>
        </div>

        <div class="flex flex-col items-center justify-start">
          <span id="gh-followers" class="text-3xl font-bold text-ghgreen mb-2">...</span>
          <span class="text-[0.65rem] font-bold text-gray-500 tracking-wider text-center leading-tight">FOLLOWERS</span>
        </div>
      </div>

    </div>

    <!-- Right Column: Graph -->
    <div
      class="w-full md:w-[65%] flex flex-col pt-2 md:pt-0 border-t md:border-t-0 md:border-l border-gray-200 dark:border-gray-800 md:pl-8">

      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-2 font-bold text-gray-800 dark:text-gray-200">
          <i class="fab fa-github text-xl"></i>
          <span>Contribution Graph</span>
        </div>
        <div class="flex items-center gap-2 text-xs font-semibold text-gray-500">
          <span class="w-2 h-2 rounded-full bg-ghgreen animate-pulse"></span>
          Live Data
        </div>
      </div>

      <!-- Graph Container -->
      <div
        class="graph-container bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-xl p-4 md:p-6 w-full overflow-x-auto shadow-sm">
        <img id="gh-chart" src="https://ghchart.rshah.org/10B981/Achintha2002" alt="GitHub Contribution Graph" />
      </div>

    </div>

  </div>

  <script>
    // Fetch Real-time GitHub Profile Data
    async function fetchGitHubProfile() {
      try {
        const res = await fetch('https://api.github.com/users/Achintha2002');
        if (!res.ok) throw new Error('Failed to fetch data');
        const data = await res.json();

        document.getElementById('gh-avatar').src = data.avatar_url;
        document.getElementById('gh-name').textContent = data.name || data.login;
        document.getElementById('gh-bio').textContent = data.bio || 'Passionate developer building awesome things for the web.';
        document.getElementById('gh-repos').textContent = data.public_repos;
        document.getElementById('gh-followers').textContent = data.followers;

      } catch (err) {
        console.error('Error fetching GitHub data:', err);
        // Fallbacks
        document.getElementById('gh-name').textContent = 'Achintha Edirisinghe';
        document.getElementById('gh-bio').textContent = 'IT Undergraduate with strong skills in Full-Stack Development and Cloud Computing.';
        document.getElementById('gh-repos').textContent = '19';
        document.getElementById('gh-followers').textContent = '5';
      }

      // Fetch Real-time Total Commits
      try {
        const commitsRes = await fetch('https://api.github.com/search/commits?q=author:Achintha2002');
        if (commitsRes.ok) {
          const commitsData = await commitsRes.json();
          document.getElementById('gh-commits').textContent = commitsData.total_count || '-';
        } else {
          console.error('GitHub API rate limit exceeded or error:', commitsRes.status);
          document.getElementById('gh-commits').textContent = '281'; // Fallback to last known good value if rate limited
        }
      } catch (err) {
        console.error('Error fetching commits data:', err);
        document.getElementById('gh-commits').textContent = '281';
      }
    }

    document.addEventListener('DOMContentLoaded', fetchGitHubProfile);
  </script>

</body>

</html>
